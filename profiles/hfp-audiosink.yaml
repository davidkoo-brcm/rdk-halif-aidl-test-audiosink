profile: TV                     # String value TV or STB
hal version: 1.0.0              # String value
IAudioDecoderManager:  # Component object begins
    interfaceVersion: 2         # Integer value
    IAudioDecoder:              # Resource list
      - id: 0                   # Resource object begins
        supportedCodecs:        # Array of codec capabilities
          - AAC_LC
          - HE_AAC
          - HE_AAC2
          - DOLBY_AC3
          - DOLBY_AC3_PLUS
          - DOLBY_AC3_PLUS_JOC
          - DOLBY_AC4
          - X_HE_AAC
        supportsSecure: true
      - id: 1                   # Resource object begins
        supportedCodecs:        # Array of codec capabilities
          - AAC_LC
          - HE_AAC
          - HE_AAC2
          - DOLBY_AC3
          - DOLBY_AC3_PLUS
          - DOLBY_AC3_PLUS_JOC
          - DOLBY_AC4
          - X_HE_AAC
        supportsSecure: true
IAudioSinkManager:     # Component object begins
    interfaceVersion: 1         # Integer value
    platformCapabilities:
      - supportsLowLatency: false
      - systemMixerSampleRateHz: 48000
      - systemMixerPCMFormat: S32BE
      - supportsPlanarFormat: false
    IAudioSink:                 # Resource list
      - id: 0                   # Resource object begins
      - id: 1
