AudioStreams:
  tones_48k_2_256_mp3:
    input: tones_48k_2_256.mp3 # Stream name
    reference: tones_48k_2_256_ref.pcm #Reference stream name
    codec: MP3 # audio codec information, Refer `Codec` enum
    sample_rate: 48000 #Sample rate in `Hz`
    channels: 2 #Number of audio channels
    format: S16LE # `pcm` format of the reference stream. Refer `PCMFormat` enum
    num_of_frames: 10 #Total number of frames in the stream
    duration: 240000000 # (1152 samples/frame x 10 frames x 1e9) / 48000 Hz
    frame_size: #Byte size for each frame, listed in order
      - 288
      - 312
      - 372
      - 370
      - 344
      - 362
      - 360
      - 356
      - 355
      - 334
